<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理平台 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>项目管理平台</h1>
                <p>请登录或注册账号</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>
            
            <div class="auth-content">
                <!-- 登录表单 -->
                <div class="tab-content active" id="login">
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-email">邮箱</label>
                            <input type="email" id="login-email" class="input" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">密码</label>
                            <input type="password" id="login-password" class="input" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn primary">登录</button>
                        </div>
                    </form>
                </div>
                
                <!-- 注册表单 -->
                <div class="tab-content" id="register">
                    <form id="register-form">
                        <div class="form-group">
                            <label for="register-email">邮箱</label>
                            <input type="email" id="register-email" class="input" required>
                        </div>
                        <div class="form-group">
                            <label for="register-password">密码</label>
                            <input type="password" id="register-password" class="input" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn primary">注册</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知区域 -->
    <div id="notification" class="notification"></div>

    <script>
        // 切换标签
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有标签的active类
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                // 添加当前标签的active类
                btn.classList.add('active');
                
                // 隐藏所有内容
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                // 显示当前标签对应的内容
                const tabId = btn.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');
            });
        });

        // 登录表单提交
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    const error = await response.json();
                    showNotification(error.error || '登录失败', 'error');
                }
            } catch (error) {
                console.error('Error logging in:', error);
                showNotification('网络错误，请稍后重试', 'error');
            }
        });

        // 注册表单提交
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showNotification(data.message || '注册成功', 'success');
                    // 切换到登录标签
                    document.querySelectorAll('.tab-btn')[0].click();
                } else {
                    const error = await response.json();
                    showNotification(error.error || '注册失败', 'error');
                }
            } catch (error) {
                console.error('Error registering:', error);
                showNotification('网络错误，请稍后重试', 'error');
            }
        });

        // 显示通知
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            if (notification) {
                notification.textContent = message;
                notification.className = `notification ${type} show`;
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        }
    </script>
</body>
</html>
