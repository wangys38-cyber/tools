<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Moto Test Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h1 {
            font-size: 24px;
            font-weight: bold;
            color: #4a6fa5;
            margin-bottom: 10px;
        }
        .auth-header p {
            color: #666;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        .input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        .input:focus {
            outline: none;
            border-color: #4a6fa5;
            box-shadow: 0 0 0 2px rgba(74, 111, 165, 0.1);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn.primary {
            background-color: #4a6fa5;
            color: #fff;
        }
        .btn.primary:hover {
            background-color: #3a5a85;
        }
        .btn.secondary {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn.secondary:hover {
            background-color: #e0e0e0;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .auth-footer a {
            color: #4a6fa5;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .error-message {
            background-color: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .success-message {
            background-color: #e8f5e8;
            color: #2e7d32;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .tab-container {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 1px solid #e0e0e0;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: #4a6fa5;
            border-bottom-color: #4a6fa5;
        }
        .form-content {
            display: none;
        }
        .form-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>用例管理平台</h1>
            <p>请登录或注册账号</p>
        </div>
        
        <div class="tab-container">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>
        
        <!-- 登录表单 -->
        <div class="form-content active" id="login-form-content">
            <div id="login-error" class="error-message" style="display: none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">邮箱</label>
                    <input type="email" id="login-email" class="input" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" class="input" required>
                </div>
                <button type="submit" class="btn primary">登录</button>
            </form>
        </div>
        
        <!-- 注册表单 -->
        <div class="form-content" id="register-form-content">
            <div id="register-error" class="error-message" style="display: none;"></div>
            <div id="register-success" class="success-message" style="display: none;"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-email">邮箱</label>
                    <input type="email" id="register-email" class="input" required>
                </div>
                <div class="form-group">
                    <label for="register-password">密码</label>
                    <input type="password" id="register-password" class="input" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">确认密码</label>
                    <input type="password" id="register-confirm-password" class="input" required>
                </div>
                <button type="submit" class="btn primary">注册</button>
                <p style="margin-top: 15px; font-size: 14px; color: #666;">
                    注册后需要等待项目负责人审批同意才能登录
                </p>
            </form>
        </div>
    </div>

    <script>
        // 标签切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 移除所有标签的active类
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                // 添加当前标签的active类
                tab.classList.add('active');
                
                // 隐藏所有表单内容
                document.querySelectorAll('.form-content').forEach(content => content.classList.remove('active'));
                // 显示对应标签的表单内容
                const tabId = tab.getAttribute('data-tab');
                document.getElementById(`${tabId}-form-content`).classList.add('active');
            });
        });
        
        // 登录表单提交
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorElement = document.getElementById('login-error');
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    // 存储token和用户信息到本地存储
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // 跳转到主页面
                    window.location.href = 'index.html';
                } else {
                    const errorData = await response.json();
                    errorElement.textContent = errorData.error || '登录失败';
                    errorElement.style.display = 'block';
                }
            } catch (error) {
                console.error('Error logging in:', error);
                errorElement.textContent = '网络错误，请稍后重试';
                errorElement.style.display = 'block';
            }
        });
        
        // 注册表单提交
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            const errorElement = document.getElementById('register-error');
            const successElement = document.getElementById('register-success');
            
            // 验证密码是否一致
            if (password !== confirmPassword) {
                errorElement.textContent = '两次输入的密码不一致';
                errorElement.style.display = 'block';
                successElement.style.display = 'none';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    successElement.textContent = data.message || '注册成功';
                    successElement.style.display = 'block';
                    errorElement.style.display = 'none';
                    // 清空表单
                    document.getElementById('register-form').reset();
                    // 切换到登录标签
                    document.querySelectorAll('.tab')[0].click();
                } else {
                    const errorData = await response.json();
                    errorElement.textContent = errorData.error || '注册失败';
                    errorElement.style.display = 'block';
                    successElement.style.display = 'none';
                }
            } catch (error) {
                console.error('Error registering:', error);
                errorElement.textContent = '网络错误，请稍后重试';
                errorElement.style.display = 'block';
                successElement.style.display = 'none';
            }
        });
        
        // 检查用户是否已登录
        try {
            if (localStorage.getItem('token')) {
                window.location.href = 'index.html';
            }
        } catch (error) {
            console.error('Error checking login status:', error);
        }
    </script>
</body>
</html>
