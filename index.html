<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Todo - 炫酷待办事项管理</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- GSAP 动画库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                        light: '#F8FAFC',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                @apply bg-white/10 backdrop-blur-lg border border-white/20 shadow-lg;
            }
            .glass-dark {
                @apply bg-dark/70 backdrop-blur-lg border border-white/10 shadow-lg;
            }
            .glass-card {
                @apply bg-white/5 backdrop-blur-md border border-white/10 shadow-lg hover:shadow-xl transition-all duration-300;
            }
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary;
            }
            .bg-gradient-main {
                @apply bg-gradient-to-br from-dark via-primary/20 to-secondary/20;
            }
            .task-hover {
                @apply hover:scale-[1.02] hover:shadow-2xl transition-all duration-300;
            }
        }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            @apply bg-transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            @apply bg-white/20 rounded-full hover:bg-white/30 transition-colors;
        }
        
        /* 粒子效果容器 */
        #particles-container {
            @apply fixed inset-0 pointer-events-none z-50;
        }
        
        /* 任务完成动画 */
        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        
        /* 背景动画 */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        body {
            animation: gradientShift 15s ease infinite;
            background-size: 400% 400%;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-main text-light font-sans overflow-x-hidden">
    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="absolute top-0 left-0 w-full h-full">
            <div class="absolute top-[10%] left-[15%] w-72 h-72 bg-primary/30 rounded-full filter blur-[80px]"></div>
            <div class="absolute top-[40%] right-[10%] w-80 h-80 bg-secondary/30 rounded-full filter blur-[100px]"></div>
            <div class="absolute bottom-[15%] left-[30%] w-64 h-64 bg-purple-500/20 rounded-full filter blur-[90px]"></div>
        </div>
    </div>
    
    <!-- 粒子效果容器 -->
    <div id="particles-container"></div>
    
    <!-- 主容器 -->
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- 头部 -->
        <header class="mb-8 text-center">
            <h1 class="text-5xl md:text-6xl font-bold text-gradient mb-2">Glass Todo</h1>
            <p class="text-white/70 text-lg">炫酷待办事项管理，让任务完成更有成就感</p>
        </header>
        
        <!-- 分类导航 -->
        <div class="glass rounded-xl p-4 mb-8 overflow-x-auto">
            <div class="flex space-x-2 md:space-x-4 min-w-max">
                <button class="category-btn active px-4 py-2 rounded-lg bg-white/20 hover:bg-white/30 transition-colors" data-category="all">
                    <i class="fa fa-list-ul mr-2"></i>全部
                </button>
                <button class="category-btn px-4 py-2 rounded-lg hover:bg-white/20 transition-colors" data-category="work">
                    <i class="fa fa-briefcase mr-2"></i>工作
                </button>
                <button class="category-btn px-4 py-2 rounded-lg hover:bg-white/20 transition-colors" data-category="study">
                    <i class="fa fa-book mr-2"></i>学习
                </button>
                <button class="category-btn px-4 py-2 rounded-lg hover:bg-white/20 transition-colors" data-category="life">
                    <i class="fa fa-heart mr-2"></i>生活
                </button>
                <button class="category-btn px-4 py-2 rounded-lg hover:bg-white/20 transition-colors" data-category="other">
                    <i class="fa fa-ellipsis-h mr-2"></i>其他
                </button>
            </div>
        </div>
        
        <!-- 任务统计 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="glass rounded-xl p-4 text-center">
                <h3 class="text-white/70 mb-1">总任务</h3>
                <p id="total-tasks" class="text-3xl font-bold">3</p>
            </div>
            <div class="glass rounded-xl p-4 text-center">
                <h3 class="text-white/70 mb-1">已完成</h3>
                <p id="completed-tasks" class="text-3xl font-bold text-success">0</p>
            </div>
            <div class="glass rounded-xl p-4 text-center">
                <h3 class="text-white/70 mb-1">待完成</h3>
                <p id="pending-tasks" class="text-3xl font-bold text-warning">0</p>
            </div>
        </div>
        
        <!-- 任务列表 -->
        <div id="task-list" class="space-y-4 mb-8 min-h-[200px]">
            <!-- 任务卡片将通过JS动态生成 -->
            <div class="glass-card rounded-xl p-6 text-center text-white/50" id="empty-state">
                <i class="fa fa-check-circle text-5xl mb-4"></i>
                <p>暂无任务，点击右下角按钮添加</p>
            </div>
        </div>
        
        <!-- 添加任务按钮 -->
        <button id="add-task-btn" class="fixed bottom-6 right-6 w-16 h-16 rounded-full glass flex items-center justify-center text-2xl hover:scale-110 transition-transform shadow-lg">
            <i class="fa fa-plus"></i>
        </button>
    </div>
    
    <!-- 添加/编辑任务模态框 -->
    <div id="task-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-dark rounded-2xl p-6 w-full max-w-md transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="text-2xl font-bold">添加新任务</h2>
                <button id="close-modal" class="text-white/70 hover:text-white text-xl">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            
            <form id="task-form">
                <input type="hidden" id="task-id">
                
                <div class="mb-4">
                    <label for="task-title" class="block text-white/80 mb-2">任务标题</label>
                    <input type="text" id="task-title" class="w-full glass rounded-lg p-3 bg-white/5 border border-white/10 focus:border-primary focus:outline-none" placeholder="输入任务标题..." required="">
                </div>
                
                <div class="mb-4">
                    <label for="task-description" class="block text-white/80 mb-2">任务描述</label>
                    <textarea id="task-description" class="w-full glass rounded-lg p-3 bg-white/5 border border-white/10 focus:border-primary focus:outline-none h-24" placeholder="输入任务描述（可选）"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="task-category" class="block text-white/80 mb-2">分类</label>
                        <select id="task-category" class="w-full glass rounded-lg p-3 bg-white/5 border border-white/10 focus:border-primary focus:outline-none">
                            <option value="work">工作</option>
                            <option value="study">学习</option>
                            <option value="life">生活</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="task-priority" class="block text-white/80 mb-2">优先级</label>
                        <select id="task-priority" class="w-full glass rounded-lg p-3 bg-white/5 border border-white/10 focus:border-primary focus:outline-none">
                            <option value="low">低</option>
                            <option value="medium" selected="">中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label for="task-due-date" class="block text-white/80 mb-2">截止日期</label>
                    <input type="date" id="task-due-date" class="w-full glass rounded-lg p-3 bg-white/5 border border-white/10 focus:border-primary focus:outline-none">
                </div>
                
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancel-task" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-colors">取消</button>
                    <button type="submit" class="px-6 py-2 rounded-lg bg-gradient-to-r from-primary to-secondary hover:opacity-90 transition-opacity">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 确认删除模态框 -->
    <div id="delete-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-dark rounded-2xl p-6 w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4">确认删除</h3>
            <p class="mb-6">确定要删除这个任务吗？此操作无法撤销。</p>
            
            <div class="flex justify-end space-x-3">
                <button id="cancel-delete" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-colors">取消</button>
                <button id="confirm-delete" class="px-6 py-2 rounded-lg bg-danger hover:opacity-90 transition-opacity">删除</button>
            </div>
        </div>
    </div>


<script>
    // 任务数据管理
    class TaskManager {
        constructor() {
            this.tasks = JSON.parse(localStorage.getItem('glass-todo-tasks')) || [];
            this.currentCategory = 'all';
            this.currentEditId = null;
            this.currentDeleteId = null;
            this.init();
        }
        
        init() {
            this.renderTasks();
            this.updateStats();
            this.setupEventListeners();
        }
        
        setupEventListeners() {
            // 添加任务按钮
            document.getElementById('add-task-btn').addEventListener('click', () => this.openAddModal());
            
            // 模态框关闭按钮
            document.getElementById('close-modal').addEventListener('click', () => this.closeModal());
            document.getElementById('cancel-task').addEventListener('click', () => this.closeModal());
            
            // 任务表单提交
            document.getElementById('task-form').addEventListener('submit', (e) => this.saveTask(e));
            
            // 删除模态框
            document.getElementById('cancel-delete').addEventListener('click', () => this.closeDeleteModal());
            document.getElementById('confirm-delete').addEventListener('click', () => this.confirmDelete());
            
            // 分类按钮
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    this.currentCategory = e.target.dataset.category;
                    this.updateCategoryButtons();
                    this.renderTasks();
                });
            });
            
            // 点击模态框外部关闭
            document.getElementById('task-modal').addEventListener('click', (e) => {
                if (e.target.id === 'task-modal') this.closeModal();
            });
            
            document.getElementById('delete-modal').addEventListener('click', (e) => {
                if (e.target.id === 'delete-modal') this.closeDeleteModal();
            });
        }
        
        openAddModal() {
            this.currentEditId = null;
            document.getElementById('modal-title').textContent = '添加新任务';
            document.getElementById('task-form').reset();
            
            // 设置默认日期为明天
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('task-due-date').valueAsDate = tomorrow;
            
            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('task-title').focus();
            
            // 模态框动画
            gsap.fromTo('#task-modal > div', 
                { scale: 0.8, opacity: 0 },
                { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(1.7)' }
            );
        }
        
        openEditModal(id) {
            const task = this.tasks.find(t => t.id === id);
            if (!task) return;
            
            this.currentEditId = id;
            document.getElementById('modal-title').textContent = '编辑任务';
            document.getElementById('task-id').value = task.id;
            document.getElementById('task-title').value = task.title;
            document.getElementById('task-description').value = task.description || '';
            document.getElementById('task-category').value = task.category;
            document.getElementById('task-priority').value = task.priority;
            
            if (task.dueDate) {
                document.getElementById('task-due-date').value = task.dueDate;
            } else {
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                document.getElementById('task-due-date').valueAsDate = tomorrow;
            }
            
            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('task-title').focus();
            
            // 模态框动画
            gsap.fromTo('#task-modal > div', 
                { scale: 0.8, opacity: 0 },
                { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(1.7)' }
            );
        }
        
        closeModal() {
            gsap.to('#task-modal > div', {
                scale: 0.8,
                opacity: 0,
                duration: 0.2,
                onComplete: () => {
                    document.getElementById('task-modal').classList.add('hidden');
                    this.currentEditId = null;
                }
            });
        }
        
        saveTask(e) {
            e.preventDefault();
            
            const title = document.getElementById('task-title').value.trim();
            const description = document.getElementById('task-description').value.trim();
            const category = document.getElementById('task-category').value;
            const priority = document.getElementById('task-priority').value;
            const dueDate = document.getElementById('task-due-date').value;
            
            if (!title) {
                this.showNotification('请输入任务标题', 'warning');
                return;
            }
            
            const taskData = {
                title,
                description,
                category,
                priority,
                dueDate,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            if (this.currentEditId) {
                // 编辑现有任务
                const taskIndex = this.tasks.findIndex(t => t.id === this.currentEditId);
                if (taskIndex !== -1) {
                    this.tasks[taskIndex] = { ...this.tasks[taskIndex], ...taskData };
                    this.showNotification('任务已更新', 'success');
                }
            } else {
                // 添加新任务
                taskData.id = Date.now().toString();
                this.tasks.unshift(taskData);
                this.showNotification('任务已添加', 'success');
            }
            
            this.saveToLocalStorage();
            this.renderTasks();
            this.updateStats();
            this.closeModal();
        }
        
        deleteTask(id) {
            this.currentDeleteId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
            
            // 模态框动画
            gsap.fromTo('#delete-modal > div', 
                { scale: 0.8, opacity: 0 },
                { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(1.7)' }
            );
        }
        
        closeDeleteModal() {
            gsap.to('#delete-modal > div', {
                scale: 0.8,
                opacity: 0,
                duration: 0.2,
                onComplete: () => {
                    document.getElementById('delete-modal').classList.add('hidden');
                    this.currentDeleteId = null;
                }
            });
        }
        
        confirmDelete() {
            if (this.currentDeleteId) {
                const taskIndex = this.tasks.findIndex(t => t.id === this.currentDeleteId);
                if (taskIndex !== -1) {
                    this.tasks.splice(taskIndex, 1);
                    this.saveToLocalStorage();
                    this.renderTasks();
                    this.updateStats();
                    this.showNotification('任务已删除', 'success');
                }
            }
            this.closeDeleteModal();
        }
        
        toggleTask(id) {
            const taskIndex = this.tasks.findIndex(t => t.id === id);
            if (taskIndex !== -1) {
                const task = this.tasks[taskIndex];
                const wasCompleted = task.completed;
                task.completed = !task.completed;
                
                if (task.completed && !wasCompleted) {
                    // 任务从未完成变为已完成，显示庆祝效果
                    this.createExplosionEffect(id);
                    this.showNotification('恭喜！任务完成', 'success');
                }
                
                this.saveToLocalStorage();
                this.renderTasks();
                this.updateStats();
            }
        }
        
        createExplosionEffect(taskId) {
            const taskElement = document.querySelector(`[data-task-id="${taskId}"]`);
            if (!taskElement) return;
            
            const rect = taskElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // 创建粒子
            const particleCount = 50;
            const colors = ['#8B5CF6', '#3B82F6', '#10B981', '#F59E0B', '#EC4899'];
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                const size = Math.random() * 8 + 4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                particle.style.position = 'fixed';
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = color;
                particle.style.borderRadius = '50%';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '100';
                
                document.getElementById('particles-container').appendChild(particle);
                
                // 随机方向和距离
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 40;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                
                // 动画
                gsap.to(particle, {
                    x: x,
                    y: y,
                    opacity: 0,
                    duration: 1 + Math.random(),
                    ease: 'power2.out',
                    onComplete: () => {
                        particle.remove();
                    }
                });
            }
        }
        
        renderTasks() {
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');
            
            // 过滤任务
            let filteredTasks = this.tasks;
            if (this.currentCategory !== 'all') {
                filteredTasks = this.tasks.filter(task => task.category === this.currentCategory);
            }
            
            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
                taskList.innerHTML = '';
                taskList.appendChild(emptyState);
                return;
            }
            
            emptyState.classList.add('hidden');
            taskList.innerHTML = '';
            
            // 按优先级和创建时间排序
            filteredTasks.sort((a, b) => {
                const priorityOrder = { high: 0, medium: 1, low: 2 };
                if (a.completed !== b.completed) return a.completed - b.completed;
                if (a.priority !== b.priority) return priorityOrder[a.priority] - priorityOrder[b.priority];
                return new Date(b.createdAt) - new Date(a.createdAt);
            });
            
            // 渲染任务卡片
            filteredTasks.forEach(task => {
                const taskCard = this.createTaskCard(task);
                taskList.appendChild(taskCard);
                
                // 入场动画
                gsap.fromTo(taskCard,
                    { y: 20, opacity: 0 },
                    { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out' }
                );
            });
        }
        
        createTaskCard(task) {
            const card = document.createElement('div');
            card.className = `glass-card rounded-xl p-5 task-hover ${task.completed ? 'opacity-60' : ''}`;
            card.dataset.taskId = task.id;
            
            const priorityColors = {
                high: 'bg-danger',
                medium: 'bg-warning',
                low: 'bg-success'
            };
            
            const categoryIcons = {
                work: 'fa-briefcase',
                study: 'fa-book',
                life: 'fa-heart',
                other: 'fa-ellipsis-h'
            };
            
            const categoryNames = {
                work: '工作',
                study: '学习',
                life: '生活',
                other: '其他'
            };
            
            const dueDateText = task.dueDate ? new Date(task.dueDate).toLocaleDateString('zh-CN') : '无截止日期';
            const isOverdue = task.dueDate && !task.completed && new Date(task.dueDate) < new Date();
            
            card.innerHTML = `
                <div class="flex items-start gap-4">
                    <div class="flex-shrink-0">
                        <button class="w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-success border-success' : 'border-white/50'} flex items-center justify-center transition-colors hover:scale-110" 
                                onclick="taskManager.toggleTask('${task.id}')">
                            ${task.completed ? '<i class="fa fa-check text-white text-sm"></i>' : ''}
                        </button>
                    </div>
                    
                    <div class="flex-grow">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-sm px-2 py-1 rounded-full ${priorityColors[task.priority]}">
                                ${task.priority === 'high' ? '高' : task.priority === 'medium' ? '中' : '低'}
                            </span>
                            <span class="text-xs px-2 py-1 rounded-full bg-white/10 flex items-center gap-1">
                                <i class="fa ${categoryIcons[task.category]}"></i>
                                ${categoryNames[task.category]}
                            </span>
                        </div>
                        
                        <h3 class="text-xl font-semibold mb-1 ${task.completed ? 'line-through text-white/50' : ''}">${task.title}</h3>
                        
                        ${task.description ? `<p class="text-white/70 mb-3 ${task.completed ? 'line-through' : ''}">${task.description}</p>` : ''}
                        
                        <div class="flex items-center justify-between text-sm text-white/50">
                            <div class="flex items-center gap-1 ${isOverdue ? 'text-danger' : ''}">
                                <i class="fa fa-calendar"></i>
                                ${dueDateText}
                                ${isOverdue ? ' (已逾期)' : ''}
                            </div>
                            
                            <div class="flex gap-2">
                                <button class="hover:text-white transition-colors" onclick="taskManager.openEditModal('${task.id}')">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button class="hover:text-danger transition-colors" onclick="taskManager.deleteTask('${task.id}')">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }
        
        updateCategoryButtons() {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.dataset.category === this.currentCategory) {
                    btn.classList.add('active', 'bg-white/20');
                } else {
                    btn.classList.remove('active', 'bg-white/20');
                }
            });
        }
        
        updateStats() {
            const total = this.tasks.length;
            const completed = this.tasks.filter(task => task.completed).length;
            const pending = total - completed;
            
            document.getElementById('total-tasks').textContent = total;
            document.getElementById('completed-tasks').textContent = completed;
            document.getElementById('pending-tasks').textContent = pending;
        }
        
        saveToLocalStorage() {
            localStorage.setItem('glass-todo-tasks', JSON.stringify(this.tasks));
        }
        
        showNotification(message, type = 'info') {
            // 创建通知元素
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 glass-dark rounded-lg px-4 py-3 z-50 transform transition-all duration-300 translate-x-full`;
            
            const typeIcons = {
                success: 'fa-check-circle text-success',
                warning: 'fa-exclamation-triangle text-warning',
                error: 'fa-times-circle text-danger',
                info: 'fa-info-circle text-primary'
            };
            
            notification.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fa ${typeIcons[type] || typeIcons.info}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // 显示动画
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
            }, 100);
            
            // 自动隐藏
            setTimeout(() => {
                notification.classList.add('translate-x-full');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }
    }
